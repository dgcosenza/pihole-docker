# Production-style compose example for dgcosenza/pihole
#
# Replace 192.168.1.101 with your host's LAN IP, change the timezone and the
# web password, and pin the image by @sha256 digest for production.
#
# This example pairs Pi-hole with dgcosenza/unbound as its recursive upstream.
# Remove the `unbound` service and the `dns_upstreams` line if you prefer
# public resolvers.

services:
  pihole:
    image: dgcosenza/pihole:latest
    container_name: pihole
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      # DNS: bind to the interfaces you actually serve.
      - "192.168.1.101:53:53/tcp"
      - "192.168.1.101:53:53/udp"
      - "127.0.0.1:53:53/tcp"
      - "127.0.0.1:53:53/udp"
      # Web interface.
      - "192.168.1.101:80:80/tcp"
      - "127.0.0.1:8080:80/tcp"
    environment:
      TZ: "Europe/Berlin"
      # Prefer a Docker secret over a plain environment variable:
      #   WEBPASSWORD_FILE: pihole_password   (mounted at /run/secrets/pihole_password)
      FTLCONF_webserver_api_password: "change-me"
      # Recursive resolver on the compose network (see the unbound service).
      FTLCONF_dns_upstreams: "172.20.0.10#53"
      # Required when clients reach the container through NAT (bridge network,
      # Tailscale): otherwise dnsmasq ignores non-local queries.
      FTLCONF_dns_listeningMode: "all"
      # Rate limiting is per client address; behind NAT every client looks like
      # the gateway, so the default 1000/60s trips and cuts off all DNS.
      FTLCONF_dns_rateLimit_count: "0"
      FTLCONF_dns_rateLimit_interval: "60"
      # Conditional forwarding for the LAN reverse zone.
      FTLCONF_dns_revServers: "true,192.168.1.0/24,192.168.1.1,lan"
    volumes:
      - ./etc-pihole:/etc/pihole
      - ./etc-dnsmasq.d:/etc/dnsmasq.d
      - ./var-log-pihole:/var/log/pihole
    cap_add:
      - NET_ADMIN
      - SYS_NICE
    healthcheck:
      test: ["CMD-SHELL", "dig -p $(pihole-FTL --config dns.port) +short +norecurse +retry=0 @127.0.0.1 pi.hole || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 1024M
    networks:
      default:
        ipv4_address: 172.20.0.11

  unbound:
    image: dgcosenza/unbound:latest
    container_name: unbound
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      default:
        ipv4_address: 172.20.0.10
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 256M

networks:
  default:
    ipam:
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1
